<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sistema Inmunitario — Infografía Interactiva</title>
  <link rel="stylesheet" href="css/pizarra.css?v=5">
</head>
<body>

  <!-- ======================================================================
       0. PANTALLA DE INTRODUCCIÓN CON EFECTO MÁQUINA DE ESCRIBIR
       ====================================================================== -->
  <section id="intro-screen" title="Haz clic en cualquier parte para continuar">
    <div class="intro-container">
      <div class="intro-terminal-box">
        <span id="intro-text" class="typewriter-text"></span>
        <span class="intro-cursor">_</span>
      </div>
      <div id="intro-prompt" class="intro-prompt">
        <span>Pulsa la pantalla para continuar</span>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       1. PANEL PRINCIPAL: 7 PUNTOS EN CUADRÍCULA (4 ARRIBA, 3 ABAJO) CONECTADOS
       ====================================================================== -->
  <main id="main-panel">
    
    <!-- Capa SVG con la línea normal conectora -->
    <svg id="connections-svg" class="connections-svg">
      <path id="main-connecting-path" class="connecting-line" d=""></path>
    </svg>

    <!-- Cuadrícula limpia de los 7 puntos con fotos redondeadas sin textos -->
    <div class="grid-container">
      <!-- Fila superior: 1, 2, 3, 4 -->
      <div class="grid-row row-top">
        <div class="station-card station-card-0 current-active" data-index="0" title="Punto 1: Barreras Anatómicas y el Antígeno">
          <img src="imagenes/fondos/P45_piel.png" alt="Punto 1">
        </div>
        <div class="station-card station-card-1" data-index="1" title="Punto 2: La Fábrica Celular: Médula Ósea">
          <img src="imagenes/fondos/P47_medula.png" alt="Punto 2">
        </div>
        <div class="station-card station-card-2" data-index="2" title="Punto 3: Alarma Tisular, Quimiotaxis y Fagocitosis">
          <img src="imagenes/fondos/P49_tejido_infectado.png" alt="Punto 3">
        </div>
        <div class="station-card station-card-3" data-index="3" title="Punto 4: El Sistema del Complemento">
          <img src="imagenes/fondos/P48_vaso.png" alt="Punto 4">
        </div>
      </div>

      <!-- Fila inferior: 5, 6, 7 -->
      <div class="grid-row row-bottom">
        <div class="station-card station-card-4" data-index="4" title="Punto 5: La Célula Dendrítica y Presentación en Ganglio">
          <img src="imagenes/fondos/P50_ganglio.png" alt="Punto 5">
        </div>
        <div class="station-card station-card-5" data-index="5" title="Punto 6: Inmunidad Adaptativa: Celular y Humoral">
          <img src="imagenes/fondos/P49_tejido_infectado.png" alt="Punto 6">
        </div>
        <div class="station-card station-card-6" data-index="6" title="Punto 7: Anticuerpos y Memoria Inmunológica">
          <img src="imagenes/fondos/P52_tejido_sano.png" alt="Punto 7">
        </div>
      </div>
    </div>

  </main>

  <!-- ======================================================================
       2. ESCENA AMPLIADA / VISTA DETALLE AL HACER CLIC EN UN PUNTO
       ====================================================================== -->
  <div id="zoomed-stage-overlay">
    
    <!-- Fondo nítido de la escena activa -->
    <img id="stage-hero-bg" class="stage-hero-background" src="" alt="Escenario Biológico">

    <!-- Botón para volver al panel de los 7 puntos -->
    <button id="btn-back-to-panel" class="back-to-panel-btn" title="Volver al panel principal">
      <span>‹ Volver al Esquema</span>
    </button>

    <!-- Capa de personajes vivos, flotantes y animados -->
    <div id="stage-characters-layer" class="stage-characters-container">
      <!-- Personajes inyectados dinámicamente -->
    </div>

    <!-- Caja de narración inferior con mecanografiado (Typewriter) -->
    <div id="pizarra-narration-box">
      <div class="narration-header">
        <span id="narration-speaker" class="narration-speaker-tag">NARRADOR</span>
        <span id="narration-counter" class="narration-counter">1 / 5</span>
      </div>

      <div id="narration-text" class="narration-text-content">
        Cargando narración...
      </div>

      <div class="narration-footer">
        <span class="narration-hint">Haz clic para avanzar diálogo · Pulsa Espacio o Flecha</span>
        <div class="narration-btn-row">
          <button id="btn-narr-continue" class="narration-nav-btn">Siguiente ›</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ======================================================================
       3. MODAL DE FICHA EDUCATIVA DE PERSONAJE
       ====================================================================== -->
  <div id="character-detail-modal">
    <div class="modal-dialog-panel">
      <button id="btn-close-modal-char" class="modal-close-btn">&times;</button>
      
      <div class="modal-char-preview-box">
        <img id="modal-char-img" src="" alt="Ilustración del personaje">
      </div>

      <span id="modal-badge-cat" class="modal-badge-cat">Categoría Biológica</span>
      <h2 id="modal-char-title" class="modal-char-title">Nombre del Personaje</h2>
      <p id="modal-char-desc" class="modal-char-desc">Descripción anatomofisiológica.</p>
    </div>
  </div>

  <!-- Scripts con versionado anti-cache -->
  <script src="js/pizarra_data.js?v=5"></script>
  <script src="js/pizarra_engine.js?v=5"></script>

</body>
</html>
