<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sistema Inmunitario — Infografía Interactiva</title>
  <link rel="stylesheet" href="css/pizarra.css?v=13">
</head>
<body>

  <!-- ======================================================================
       0. PANTALLA DE INTRODUCCIÓN CON EFECTO MÁQUINA DE ESCRIBIR
       ====================================================================== -->
  <section id="intro-screen" title="Haz clic en cualquier parte para continuar">
    <div class="intro-container">
      <div class="intro-terminal-box">
        <span id="intro-text" class="typewriter-text"></span>
        <span class="intro-cursor">_</span>
      </div>
      <div id="intro-prompt" class="intro-prompt">
        <span>Pulsa la pantalla para continuar</span>
      </div>
    </div>
  </section>

  <!-- PANTALLA DE INTRODUCCIÓN AL ENTRAR A UN CAPÍTULO POR PRIMERA VEZ -->
  <section id="chapter-intro-screen" style="display: none;" title="Haz clic para continuar">
    <div class="intro-container">
      <div class="intro-terminal-box">
        <span id="chapter-intro-text" class="typewriter-text"></span>
        <span class="intro-cursor">_</span>
      </div>
      <div id="chapter-intro-prompt" class="intro-prompt">
        <span>Pulsa la pantalla para continuar</span>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       1. PANEL PRINCIPAL: 7 PUNTOS EN CUADRÍCULA (4 ARRIBA, 3 ABAJO) CONECTADOS
       ====================================================================== -->
  <main id="main-panel">
    
    <!-- Título principal e indicación -->
    <header class="main-header">
      <h1 class="main-title">EL SISTEMA INMUNITARIO</h1>
      <p class="main-subtitle">Pincha en el recorrido para comenzar</p>
    </header>

    <!-- Capa SVG decorativa -->
    <svg id="connections-svg" class="connections-svg">
      <path id="main-connecting-path" class="connecting-line" d=""></path>
    </svg>

    <!-- Contenedor centrado para la tarjeta del Recorrido -->
    <div class="grid-container single-recorrido-container">
      <div class="station-item">
        <div class="station-card station-card-0 current-active recorrido-hero" data-index="0" title="Recorrido Completo: El Sistema Inmunitario">
          <img src="imagenes/fondos/P02_cuerpo.png" alt="Recorrido">
        </div>
        <span class="station-label recorrido-hero-label">Recorrido</span>
      </div>
    </div>

  </main>

  <!-- ======================================================================
       2. ESCENA AMPLIADA / VISTA DETALLE AL HACER CLIC EN UN PUNTO
       ====================================================================== -->
  <div id="zoomed-stage-overlay">
    
    <!-- Contenedor de Fondos Dinámicos y Crossfading -->
    <div id="stage-bg-container" class="stage-bg-container">
      <img id="stage-hero-bg-a" class="stage-hero-background active" src="" alt="Fondo Biológico Principal">
      <img id="stage-hero-bg-b" class="stage-hero-background" src="" alt="Fondo Biológico Secundario">
      <img id="stage-hero-bg-overlay" class="stage-hero-background overlay" src="" alt="Red Inmunitaria Overlay">
    </div>

    <!-- Capa de decorados de escena (ej. Dos Caminos, Barreras) -->
    <div id="stage-decorations-layer" class="stage-decorations-container"></div>

    <!-- Botón para volver al panel de inicio -->
    <button id="btn-back-to-panel" class="back-to-panel-btn" title="Volver al panel principal">
      <span>Volver al Inicio</span>
    </button>

    <!-- Capa de personajes vivos, flotantes y animados -->
    <div id="stage-characters-layer" class="stage-characters-container">
      <!-- Personajes inyectados dinámicamente -->
    </div>

    <!-- Capa de partículas efímeras (chispas, billetes, aerosoles) -->
    <div id="stage-particles-layer" class="stage-particles-container"></div>

    <!-- Caja de narración inferior con mecanografiado (sin etiqueta de narrador) -->
    <div id="pizarra-narration-box">
      <div id="narration-text" class="narration-text-content">
        Cargando narración...
      </div>

      <div class="narration-footer">
        <span class="narration-hint">Clic para avanzar · Flecha atrás, Clic dcho o Botón ratón para volver</span>
        <div class="narration-btn-row">
          <button id="btn-narr-prev" class="narration-nav-btn secondary">Anterior</button>
          <button id="btn-narr-continue" class="narration-nav-btn">Siguiente</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ======================================================================
       3. MODAL DE VISUALIZACIÓN DE CÉLULA (SOLO CÉLULA MÁS GRANDE Y SU NOMBRE)
       ====================================================================== -->
  <div id="character-detail-modal">
    <div class="modal-dialog-panel">
      <button id="btn-close-modal-char" class="modal-close-btn">&times;</button>
      
      <div class="modal-char-preview-box">
        <img id="modal-char-img" src="" alt="Célula">
      </div>

      <h2 id="modal-char-title" class="modal-char-title">Nombre</h2>
    </div>
  </div>

  <!-- Scripts con versionado anti-cache -->
  <script src="js/pizarra_data.js?v=13"></script>
  <script src="js/pizarra_engine.js?v=13"></script>

</body>
</html>
