<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sistema Inmunitario — Infografía Interactiva</title>
  <link rel="stylesheet" href="css/pizarra.css?v=3">
</head>
<body>

  <!-- ======================================================================
       0. PANTALLA DE INTRODUCCIÓN CON EFECTO MÁQUINA DE ESCRIBIR
       ====================================================================== -->
  <section id="intro-screen" title="Haz clic en cualquier parte para continuar">
    <div class="intro-container">
      <div class="intro-terminal-box">
        <span id="intro-text" class="typewriter-text"></span>
        <span class="intro-cursor">_</span>
      </div>
      <div id="intro-prompt" class="intro-prompt">
        <span>Pulsa la pantalla para continuar</span>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       1. VIEWPORT Y PANEL PRINCIPAL (FONDO AZUL OSCURO LISO)
       ====================================================================== -->
  <main id="pizarra-viewport">
    
    <div id="pizarra-world">
      
      <!-- Capa de trazos SVG conectando las estaciones -->
      <svg id="pizarra-svg-layer" viewBox="0 0 2200 1300" xmlns="http://www.w3.org/2000/svg">
        <!-- Generado dinámicamente desde pizarra_data.js -->
      </svg>

      <!-- Capa de estaciones del panel principal -->
      <div id="pizarra-stations-layer">
        <!-- Generado dinámicamente desde pizarra_data.js -->
      </div>

    </div>

  </main>

  <!-- ======================================================================
       2. ESCENA AMPLIADA / VISTA DETALLE
       ====================================================================== -->
  <div id="zoomed-stage-overlay">
    
    <!-- Fondo nítido de la escena activa -->
    <img id="stage-hero-bg" class="stage-hero-background" src="imagenes/fondos/P45_piel.png" alt="Escenario Biológico">

    <!-- Capa de personajes vivos, flotantes y animados -->
    <div id="stage-characters-layer" class="stage-characters-container">
      <!-- Personajes inyectados dinámicamente -->
    </div>

    <!-- Caja de narración inferior con mecanografiado (Typewriter) -->
    <div id="pizarra-narration-box">
      <div class="narration-header">
        <span id="narration-speaker" class="narration-speaker-tag">NARRADOR</span>
        <span id="narration-counter" class="narration-counter">1 / 5</span>
      </div>

      <div id="narration-text" class="narration-text-content">
        Cargando narración...
      </div>

      <div class="narration-footer">
        <span class="narration-hint">Haz clic para avanzar · Pulsa Espacio o Flecha</span>
        <div class="narration-btn-row">
          <button id="btn-narr-continue" class="narration-nav-btn">Siguiente ›</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ======================================================================
       3. MODAL DE FICHA EDUCATIVA DE PERSONAJE
       ====================================================================== -->
  <div id="character-detail-modal">
    <div class="modal-dialog-panel">
      <button id="btn-close-modal-char" class="modal-close-btn">&times;</button>
      
      <div class="modal-char-preview-box">
        <img id="modal-char-img" src="" alt="Ilustración del personaje">
      </div>

      <span id="modal-badge-cat" class="modal-badge-cat">Categoría Biológica</span>
      <h2 id="modal-char-title" class="modal-char-title">Nombre del Personaje</h2>
      <p id="modal-char-desc" class="modal-char-desc">Descripción anatomofisiológica.</p>
    </div>
  </div>

  <!-- Scripts con versionado anti-cache -->
  <script src="js/pizarra_data.js?v=3"></script>
  <script src="js/games.js?v=3"></script>
  <script src="js/pizarra_engine.js?v=3"></script>

</body>
</html>
